<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>ROMOR · Gastos de obra</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .view { display: none; }
  .view.active { display: block; }
  input, select, textarea { font-size: 16px; } /* evita zoom automático en iOS */
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-lg shadow-lg text-white text-sm"></div>

<!-- ===================== LOGIN ===================== -->
<div id="view-login" class="view active min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🏗️</div>
      <h1 class="text-xl font-bold text-slate-900">ROMOR</h1>
      <p class="text-slate-500 text-sm">Control de gastos de obra</p>
    </div>
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña del equipo</label>
        <input id="login-password" type="password" required
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-slate-800" />
      </div>
      <button type="submit" id="login-btn"
        class="w-full bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800 transition">
        Entrar
      </button>
      <p id="login-error" class="text-red-600 text-sm hidden"></p>
    </form>
  </div>
</div>

<!-- ===================== SELECCIÓN DE NOMBRE ===================== -->
<div id="view-name" class="view min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
    <div class="text-center mb-6">
      <div class="text-3xl mb-2">👋</div>
      <h1 class="text-lg font-bold text-slate-900">¿Quién eres?</h1>
      <p class="text-slate-500 text-sm">Así sabremos quién capturó cada gasto</p>
    </div>
    <div class="space-y-3">
      <select id="name-select" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></select>
      <div class="flex gap-2">
        <input id="name-new" type="text" placeholder="O agrega tu nombre..."
          class="flex-1 rounded-lg border border-slate-300 px-3 py-2.5" />
        <button id="name-add-btn" class="px-3 rounded-lg border border-slate-300 hover:bg-slate-50">Agregar</button>
      </div>
      <button id="name-continue-btn"
        class="w-full bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800 transition">
        Continuar
      </button>
    </div>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="view-dashboard" class="view">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-slate-900 leading-tight">🏗️ ROMOR</h1>
        <p class="text-xs text-slate-500">Hola, <span id="current-user-label" class="font-medium"></span> · <button id="change-user-btn" class="underline">cambiar</button></p>
      </div>
      <button id="logout-btn" class="text-sm text-slate-500 hover:text-slate-800">Salir</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-4 pb-24">
    <!-- Resumen -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <p class="text-xs text-slate-500">Total gastado</p>
        <p id="total-general" class="text-2xl font-bold text-slate-900">$0</p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <p class="text-xs text-slate-500">Gastos registrados</p>
        <p id="total-count" class="text-2xl font-bold text-slate-900">0</p>
      </div>
    </div>

    <!-- Totales por categoría -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-4">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">Por partida</h2>
      <div id="totales-categoria" class="space-y-2"></div>
    </div>

    <!-- Filtro -->
    <div class="flex items-center gap-2 mb-3">
      <select id="filtro-categoria" class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="">Todas las partidas</option>
      </select>
    </div>

    <!-- Lista de gastos -->
    <div id="lista-gastos" class="space-y-2"></div>
    <p id="lista-vacia" class="text-center text-slate-400 text-sm py-8 hidden">Aún no hay gastos registrados.</p>
  </main>

  <button id="fab-add"
    class="fixed bottom-5 right-5 bg-slate-900 text-white rounded-full w-14 h-14 shadow-lg flex items-center justify-center text-2xl hover:bg-slate-800">
    +
  </button>
</div>

<!-- ===================== FORMULARIO GASTO ===================== -->
<div id="view-form" class="view">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <button id="form-back-btn" class="text-slate-500 hover:text-slate-800 text-xl">←</button>
      <h1 id="form-title" class="font-bold text-slate-900">Nuevo gasto</h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-4 pb-24">
    <form id="form-gasto" class="space-y-4">
      <input type="hidden" id="gasto-id" />

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Monto (MXN)</label>
          <input id="gasto-monto" type="number" step="0.01" min="0.01" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5" placeholder="0.00" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
          <input id="gasto-fecha" type="date" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Partida / categoría</label>
        <select id="gasto-categoria" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Proveedor</label>
        <select id="gasto-proveedor" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 mb-2"></select>
        <input id="gasto-proveedor-texto" type="text" placeholder="O escribe el nombre si no está en la lista"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
        <input id="gasto-descripcion" type="text" placeholder="Ej. 3 bultos de cemento"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Método de pago</label>
          <select id="gasto-metodo" class="w-full rounded-lg border border-slate-300 px-3 py-2.5">
            <option>Efectivo</option>
            <option>Transferencia</option>
            <option>Tarjeta</option>
            <option>Cheque</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">¿Quién pagó?</label>
          <select id="gasto-pagador" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Comprobante (foto o PDF)</label>
        <input id="gasto-comprobante" type="file" accept="image/*,application/pdf" capture="environment"
          class="w-full text-sm" />
        <a id="gasto-comprobante-actual" href="#" target="_blank" class="text-sm text-blue-600 underline hidden mt-1 inline-block">Ver comprobante actual</a>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Notas</label>
        <textarea id="gasto-notas" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2.5"></textarea>
      </div>

      <p id="form-error" class="text-red-600 text-sm hidden"></p>

      <div class="flex gap-2 pt-2">
        <button type="submit" id="gasto-save-btn"
          class="flex-1 bg-slate-900 text-white rounded-lg py-2.5 font-medium hover:bg-slate-800">
          Guardar
        </button>
        <button type="button" id="gasto-delete-btn"
          class="hidden px-4 rounded-lg border border-red-300 text-red-600 hover:bg-red-50">
          Eliminar
        </button>
      </div>
    </form>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
